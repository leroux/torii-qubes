name: torii-client
arch: amd64
platform: linux
version: ${TORII_VERSION}
maintainer: Gaia PBC
description: |
  torii client for workload qubes without a network card: loopback SOCKS,
  HTTP proxy and forward ports, each connection one qrexec call to the
  qube's proxy qube. Off unless dom0 enables the torii-client service.
homepage: https://github.com/leroux/torii-qubes
license: MIT
contents:
  - src: ../../LICENSE   # a plain file: nfpm puts type: license in RPMs only
    dst: /usr/share/doc/torii-client/LICENSE
  - src: ../../build/torii-client
    dst: /usr/lib/torii/torii-client
    file_info: {mode: 0755}
  - src: ./torii-client.service
    dst: /usr/lib/systemd/system/torii-client.service
  - src: ./torii-env.sh
    dst: /etc/profile.d/torii.sh
scripts:
  postinstall: ./postinstall.sh
