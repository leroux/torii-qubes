name: torii-dom0
arch: noarch
platform: linux
version: ${TORII_VERSION}
maintainer: Gaia PBC
description: |
  torii, declarative and visible connectivity for qubes: one file per
  machine, plan / apply / show / check. Carries the proxy and client
  packages that it installs into templates, so they need no repository.
homepage: https://github.com/Gaia-PBC/torii-qubes
license: MIT
depends: [python3-qubesadmin, python3-pyyaml, qubes-core-qrexec]
contents:
  - src: ../../LICENSE
    dst: /usr/share/licenses/torii-dom0/LICENSE
    type: license
  - src: ./torii
    dst: /usr/bin/torii
    file_info: {mode: 0755}
  - src: ../../build/python/torii
    dst: /usr/share/torii/python/torii
  - src: ../../build/bundle/
    dst: /usr/share/torii/
    type: tree
  - src: ../../examples/
    dst: /usr/share/doc/torii/examples/
    type: tree
