# The test mesh: torii-* test qubes on a local Headscale (torii-headscale),
# applied separately from the main mesh (~/torii.yaml):
#   torii -f ~/torii-test.yaml plan | apply | show | check
mesh: test
machine: m1-test
tailnet:
  control-url: http://198.18.0.1:8080
proxy: { name: sys-torii-test, netvm: torii-headscale }
egress:
  peer: { exits: [torii-peer, torii-peer2] }   # two exit nodes in torii-peer, in order
defaults:
  network: none
qubes:
  torii-svc:              # no network card, a service: 80 -> its 8080 (granted), 81 (declared, not granted)
    tailnet: { identity: tagged, tags: [svc], inbound: [{port: 80, target: 8080}, 81] }
  torii-job:              # no network card: listed names, only the peer on the tailnet, a forward to it
    outbound: { internet: [example.com, pypi.org, files.pythonhosted.org], tailnet: [torii-peer] }
    tailnet: { identity: tagged, tags: [job] }
    forwards: { peer: { to: "torii-peer:7000", port: 7000 } }
  torii-job2:             # no network card, all of the internet
    outbound: { internet: all }
  torii-djob:             # no network card, Debian template: the client from the .deb
    outbound: { internet: [example.com] }
  torii-routed:           # routed: one name (and QUIC to it), the tailnet, internet through the peer's exit node, 8000 in
    network: proxy
    egress: peer
    outbound: { internet: [example.com, "example.com:443/udp"], tailnet: yes }
    tailnet: { identity: tagged, tags: [routed], inbound: [8000] }
  torii-routed2:          # routed: one name and one LAN host, no identity
    network: proxy
    outbound: { internet: [example.com, "example.com:443/udp"], lan: [192.168.1.254:80] }
