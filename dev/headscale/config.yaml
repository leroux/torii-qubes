# Headscale for lintel testing, in lintel-headscale. Devices behind this
# qube (its clients) reach it at 198.18.0.1.
server_url: http://198.18.0.1:8080
listen_addr: 198.18.0.1:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
noise:
  private_key_path: /home/user/hs/noise.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
derp:
  server:
    enabled: false
  urls: []
  paths: [/home/user/hs/derp.yaml]
  auto_update_enabled: false
disable_check_updates: true
database:
  type: sqlite
  sqlite:
    path: /home/user/hs/db.sqlite
log:
  level: info
policy:
  mode: file
  path: /home/user/hs/policy.hujson
dns:
  magic_dns: true
  base_domain: hs.lintel.test
  override_local_dns: false
  nameservers:
    global: []
unix_socket: /home/user/hs/headscale.sock
unix_socket_permission: "0770"
logtail:
  enabled: false
