# torii's charter: what torii guarantees, and the decisions that meet it.
# The Go is the proxy module (the proxy and the client); the Python is the
# dom0 tool.
name = "torii"
env-patterns = ["^TORII_[A-Z0-9_]+$"]
ignore = ["build", "tools", "dev", "contrib", "docs"]
# The docs, read for their references to entries and code; their own scope,
# which ignore does not narrow.
docs = ["docs/*.md", "docs/**/*.md"]
# Probes check observations against the real systems; none is written yet.
probes = ["proxy/internal/probe"]

# The proxy qube's guard is an nftables ruleset and systemd units, not code.
[[files]]
patterns = ["packaging/*/*.nft", "packaging/*/*.service", "packaging/*/*.conf"]
comment = "#"

[go]
module = "github.com/leroux/torii-qubes/claims"
dir = "proxy"
test = "go test -short ./..."

[python]
dir = "dom0"
test = "PYTHONPATH=../claims python3 -m unittest tests.test_torii"
env = "dom0/torii/env.py"
